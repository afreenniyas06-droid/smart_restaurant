<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Restaurant - Kitchen & Admin Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f5f5f4; color: #1c1917; min-height: 100vh; padding: 30px 48px; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: #ffffff; padding: 18px 32px; border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.04); margin-bottom: 32px;
            border: 1px solid #e7e5e4;
        }
        .brand { font-size: 20px; font-weight: 800; color: #ea580c; display: flex; align-items: center; gap: 8px; }
        .admin-tag { background: #1c1917; color: #f5f5f4; font-size: 11px; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .logout-btn { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; }
        .logout-btn:hover { background: #fee2e2; }

        .dashboard-header { margin-bottom: 24px; }
        .dashboard-header h1 { font-family: 'Playfair Display', serif; font-size: 28px; }
        .dashboard-header p { color: #78716c; font-size: 14px; margin-top: 4px; }

        /* Order Cards Grid */
        .orders-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px;
        }

        .kitchen-card {
            background: white; border-radius: 18px; border: 1.5px solid #e7e5e4;
            box-shadow: 0 8px 24px rgba(0,0,0,0.04); overflow: hidden; display: flex; flex-direction: column;
        }

        .card-top {
            padding: 16px 20px; background: #fafaf9; border-bottom: 1px solid #e7e5e4;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-top h3 { font-size: 16px; font-weight: 700; }
        .table-pill { background: #ea580c; color: white; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }

        .items-area { padding: 20px; flex-grow: 1; }
        .items-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .item-row { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px dashed #f5f5f4; padding-bottom: 8px; }
        .item-qty { font-weight: 700; color: #ea580c; margin-right: 6px; }

        .card-bottom {
            padding: 16px 20px; background: #ffffff; border-top: 1px solid #e7e5e4;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .total-bill { font-size: 15px; font-weight: 800; color: #1c1917; }

        .status-form { display: flex; gap: 8px; align-items: center; }
        .status-select { padding: 6px 10px; border-radius: 8px; border: 1.5px solid #d6d3d1; font-size: 12px; font-weight: 600; outline: none; }
        .update-btn { background: #1c1917; color: white; border: none; padding: 7px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .update-btn:hover { background: #ea580c; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="brand">
            🍴 Smart Restaurant <span class="admin-tag">Kitchen Console</span>
        </div>
        <div>
            <span style="font-size: 13px; color: #78716c; margin-right: 14px;">Chef: <b th:text="${adminName}">Admin</b></span>
            <a href="/logout" class="logout-btn">Sign Out</a>
        </div>
    </header>

    <div class="dashboard-header">
        <h1>Active Kitchen Tickets</h1>
        <p>Manage and track orders submitted by dining tables in real-time.</p>
    </div>

    <div class="orders-grid">
        <div class="kitchen-card" th:each="ord : ${orders}">
            <div class="card-top">
                <h3>Order #<span th:text="${ord.id}"></span></h3>
                <span class="table-pill">Table <span th:text="${ord.tableNumber}"></span></span>
            </div>

            <div class="items-area">
                <ul class="items-list">
                    <li class="item-row" th:each="it : ${ord.items}">
                        <div>
                            <span class="item-qty" th:text="${it.quantity} + 'x'">1x</span>
                            <span th:text="${it.menuItem.name}">Item Name</span>
                        </div>
                        <span style="font-weight: 600;">₹<span th:text="${#numbers.formatDecimal(it.price, 1, 2)}"></span></span>
                    </li>
                </ul>
            </div>

            <div class="card-bottom">
                <div class="total-bill">Total: ₹<span th:text="${#numbers.formatDecimal(ord.totalAmount, 1, 2)}"></span></div>

                <form th:action="@{/admin/orders/status}" method="post" class="status-form">
                    <input type="hidden" name="orderId" th:value="${ord.id}">
                    <select name="status" class="status-select">
                        <option value="PENDING" th:selected="${ord.status == 'PENDING'}">PENDING</option>
                        <option value="PREPARING" th:selected="${ord.status == 'PREPARING'}">PREPARING</option>
                        <option value="SERVED" th:selected="${ord.status == 'SERVED'}">SERVED</option>
                    </select>
                    <button type="submit" class="update-btn">Update</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
