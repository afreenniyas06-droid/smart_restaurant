<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Restaurant - Menu & Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #fafaf9; color: #1c1917; min-height: 100vh; }

        .navbar {
            display: flex; justify-content: space-between; align-items: center;
            background: #ffffff; padding: 18px 48px; border-bottom: 1px solid #e7e5e4;
            position: sticky; top: 0; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; color: #ea580c; }
        .user-nav { display: flex; align-items: center; gap: 14px; }
        .user-pill { background: #ffedd5; color: #9a3412; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
        .nav-btn { background: #f5f5f4; color: #44403c; border: 1px solid #e7e5e4; padding: 7px 14px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .nav-btn:hover { background: #e7e5e4; }
        .cart-pill { background: #ea580c; color: white; border-radius: 999px; padding: 2px 7px; font-size: 11px; }
        .logout-btn { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .logout-btn:hover { background: #fee2e2; }

        .hero {
            background: linear-gradient(160deg, #ea580c 0%, #c2410c 50%, #7c2d12 100%);
            color: white; padding: 44px 48px 60px; text-align: center;
        }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 36px; margin-bottom: 6px; }
        .hero p { color: rgba(255, 255, 255, 0.88); font-size: 14px; }

        .container { max-width: 1200px; margin: -28px auto 60px; padding: 0 24px; }

        .filter-bar {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 32px; flex-wrap: wrap;
        }
        .filter-btn {
            background: white; border: 1px solid #e7e5e4; padding: 9px 20px; border-radius: 999px;
            font-size: 13px; font-weight: 600; color: #57534e; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover {
            background: #ea580c; color: white; border-color: #ea580c;
        }

        .menu-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px;
        }
        .food-card {
            background: white; border-radius: 18px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #f5f5f4;
            display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s;
        }
        .food-card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.1); }
        .food-img { width: 100%; height: 180px; object-fit: cover; background: #e7e5e4; }
        .food-details { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .food-category { font-size: 11px; text-transform: uppercase; font-weight: 700; color: #ea580c; letter-spacing: 0.5px; margin-bottom: 6px; }
        .food-name { font-size: 17px; font-weight: 700; color: #1c1917; margin-bottom: 8px; }
        .food-desc { font-size: 13px; color: #78716c; line-height: 1.5; margin-bottom: 18px; flex-grow: 1; }
        .food-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px dashed #e7e5e4; }
        .price { font-size: 19px; font-weight: 700; color: #1c1917; }
        .add-btn {
            background: #ea580c; color: white; border: none; padding: 8px 16px;
            border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
            transition: background 0.2s;
        }
        .add-btn:hover { background: #c2410c; }

        /* Cart Sidebar Drawer */
        .cart-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 998;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .cart-overlay.open { opacity: 1; pointer-events: auto; }
        .cart-drawer {
            position: fixed; top: 0; right: -420px; width: 380px; max-width: 90vw; height: 100vh;
            background: white; z-index: 999; box-shadow: -6px 0 24px rgba(0,0,0,0.15);
            display: flex; flex-direction: column; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cart-drawer.open { right: 0; }
        .cart-header { padding: 20px; border-bottom: 1px solid #e7e5e4; display: flex; justify-content: space-between; align-items: center; }
        .cart-header h3 { font-size: 18px; font-weight: 700; }
        .close-btn { background: none; border: none; font-size: 22px; cursor: pointer; color: #78716c; }
        .cart-items { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #f5f5f4; padding-bottom: 12px; }
        .cart-item-info h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .cart-item-info span { font-size: 13px; color: #ea580c; font-weight: 700; }
        .qty-controls { display: flex; align-items: center; gap: 8px; }
        .qty-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #d6d3d1; background: white; cursor: pointer; font-weight: bold; }
        .cart-footer { padding: 20px; border-top: 1px solid #e7e5e4; background: #fafaf9; }
        .table-select { margin-bottom: 14px; }
        .table-select label { font-size: 12px; font-weight: 600; color: #44403c; display: block; margin-bottom: 6px; }
        .table-select select { width: 100%; padding: 8px 12px; border: 1.5px solid #d6d3d1; border-radius: 8px; font-size: 14px; outline: none; }
        .total-row { display: flex; justify-content: space-between; font-size: 17px; font-weight: 700; margin-bottom: 16px; }
        .checkout-btn { width: 100%; padding: 12px; background: #ea580c; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .checkout-btn:hover { background: #c2410c; }
        .empty-cart { text-align: center; color: #a8a29e; margin-top: 60px; font-size: 14px; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="brand">🍴 Smart Restaurant</div>
        <div class="user-nav">
            <span class="user-pill">Welcome, <b th:text="${userName}">Guest</b></span>
            <a href="/customer/orders" class="nav-btn">📋 My Orders</a>
            <button class="nav-btn" onclick="toggleCart()">🛒 Cart <span class="cart-pill" id="cartBadge">0</span></button>
            <a href="/logout" class="nav-btn logout-btn">Sign Out</a>
        </div>
    </header>

    <section class="hero">
        <h1>Handcrafted Dining Experience</h1>
        <p>Explore chef-crafted culinary dishes fresh to your table</p>
    </section>

    <main class="container">
        <div class="filter-bar">
            <button class="filter-btn active" onclick="filterCategory('All')">All Items</button>
            <button class="filter-btn" onclick="filterCategory('Starters')">Starters</button>
            <button class="filter-btn" onclick="filterCategory('Main Course')">Main Course</button>
            <button class="filter-btn" onclick="filterCategory('Desserts')">Desserts</button>
            <button class="filter-btn" onclick="filterCategory('Beverages')">Beverages</button>
        </div>

        <div class="menu-grid">
            <div class="food-card" th:each="item : ${menuItems}" th:data-category="${item.category}">
                <img class="food-img" th:src="${item.imageUrl}" th:alt="${item.name}">
                <div class="food-details">
                    <span class="food-category" th:text="${item.category}">Category</span>
                    <h3 class="food-name" th:text="${item.name}">Dish Name</h3>
                    <p class="food-desc" th:text="${item.description}">Description</p>
                    <div class="food-bottom">
                        <span class="price">₹<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">0.00</span></span>
                        <button class="add-btn" 
                                th:data-id="${item.id}"
                                th:data-name="${item.name}"
                                th:data-price="${item.price}"
                                onclick="addToCart(this.dataset.id, this.dataset.name, this.dataset.price)">+ Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Cart Overlay & Drawer -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3>Your Table Order</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>

        <div class="cart-items" id="cartItemsList">
            <div class="empty-cart">Your cart is empty. Add items from the menu!</div>
        </div>

        <div class="cart-footer">
            <div class="table-select">
                <label>Select Your Dining Table:</label>
                <select id="tableNumber">
                    <option value="1">Table 01 (Indoor Front)</option>
                    <option value="2">Table 02 (Window View)</option>
                    <option value="3">Table 03 (Terrace Dining)</option>
                    <option value="4">Table 04 (Family Lounge)</option>
                </select>
            </div>
            <div class="total-row">
                <span>Total Amount:</span>
                <span id="cartTotal">₹0.00</span>
            </div>
            <button class="checkout-btn" onclick="confirmOrder()">Confirm & Send to Kitchen</button>
        </div>
    </div>

    <script>
        let cart = {};

        function toggleCart() {
            document.getElementById('cartDrawer').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('open');
        }

        function addToCart(id, name, price) {
            price = parseFloat(price);
            if (cart[id]) {
                cart[id].quantity += 1;
            } else {
                cart[id] = { id: id, name: name, price: price, quantity: 1 };
            }
            renderCart();
            toggleCart();
        }

        function updateQty(id, delta) {
            if (cart[id]) {
                cart[id].quantity += delta;
                if (cart[id].quantity <= 0) delete cart[id];
            }
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cartItemsList');
            const badge = document.getElementById('cartBadge');
            const totalEl = document.getElementById('cartTotal');

            const keys = Object.keys(cart);
            let count = 0;
            let total = 0;

            if (keys.length === 0) {
                list.innerHTML = '<div class="empty-cart">Your cart is empty. Add items from the menu!</div>';
            } else {
                list.innerHTML = '';
                keys.forEach(k => {
                    const item = cart[k];
                    count += item.quantity;
                    total += item.price * item.quantity;

                    const div = document.createElement('div');
                    div.className = 'cart-item';
                    div.innerHTML = `
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <span>₹${(item.price * item.quantity).toFixed(2)}</span>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }

            badge.innerText = count;
            totalEl.innerText = '₹' + total.toFixed(2);
        }

        function filterCategory(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            document.querySelectorAll('.food-card').forEach(card => {
                if (cat === 'All' || card.dataset.category.toLowerCase() === cat.toLowerCase()) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        async function confirmOrder() {
            const keys = Object.keys(cart);
            if (keys.length === 0) {
                alert('Your cart is empty!');
                return;
            }

            const itemsPayload = keys.map(k => ({
                id: parseInt(cart[k].id),
                quantity: cart[k].quantity
            }));

            const tableNum = parseInt(document.getElementById('tableNumber').value);

            try {
                const res = await fetch('/api/orders/place', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tableNumber: tableNum, items: itemsPayload })
                });

                if (res.ok) {
                    alert('Order placed successfully! Sent to kitchen.');
                    cart = {};
                    renderCart();
                    toggleCart();
                    window.location.href = '/customer/orders';
                } else {
                    alert('Failed to place order.');
                }
            } catch (e) {
                alert('Network error while placing order.');
            }
        }
    </script>
</body>
</html>
